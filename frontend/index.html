<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claims Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 700px;">
    <div class="top-accent"></div>
    <h1 class="mb-3 text-center">Claims Tracker</h1>
    <p class="subtitle text-center">Track and manage insurance claims</p>
    
    <form id="claim-form" class="row g-2 mb-4">
      <div class="col-md-4">
        <input type="text" id="member-name" class="form-control" placeholder="Member name" required>
      </div>
      <div class="col-md-4">
        <input type="text" id="facility" class="form-control" placeholder="Facility" required>
      </div>
      <div class="col-md-2">
        <input type="number" id="amount" class="form-control" placeholder="Amount" required>
      </div>
      <div class="col-md-2">
        <button type="submit" class="btn btn-primary w-100">Add</button>
      </div>
    </form>

    <table class="table table-bordered bg-white">
      <thead>
        <tr>
          <th>Member</th>
          <th>Facility</th>
          <th>Amount</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="claims-table"></tbody>
    </table>
  </div>

  <script src="app.js"></script>
</body>
</html>
